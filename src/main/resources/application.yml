spring:
  application:
    name: conveyor-ci
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/conveyor}
    username: ${DB_USER:conveyor}
    password: ${DB_PASSWORD:conveyor}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:63790}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate:
        default_batch_fetch_size: 50   # loads jobs/steps/dependencies in batches, avoiding N+1 queries
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

conveyor:
  scheduler:
    enabled: true            # set false on worker-only nodes
    interval-ms: 1000        # safety-net pass: reaps leases, ends retry backoffs, recovers lost wake-ups
    redispatch-seconds: 30   # re-push QUEUED jobs nobody claimed (covers lost Redis messages)
    wake-on-events: true     # run a pass as soon as a run is created or a job finishes
  worker:
    enabled: true            # set false on API-only nodes
    concurrency: 2           # jobs this process runs at once
    lease-seconds: 30        # a job is re-queued this long after its worker stops heartbeating
  retry:
    base-delay-ms: 2000      # backoff = base * 2^(attempt-1), +/-20% jitter
    max-delay-ms: 60000
  runtime: docker            # docker, or simulated (load tests only: nothing is executed)
  docker:
    memory: 1g               # per-job container limits
    cpus: 1
  public-url: ${CONVEYOR_PUBLIC_URL:http://localhost:8080}   # used in commit status links
  github:
    api-url: https://api.github.com
    token: ${GITHUB_TOKEN:}                   # needed for commit statuses and private repos
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:} # webhooks are rejected until this is set
    pipeline-path: .conveyor.yml              # pipeline file read from each pushed commit
    status-interval-ms: 2000
    status-retry-base-ms: 2000
