# Example pipeline. Jobs run in parallel unless connected by `needs`.
# Each job runs in its own container; steps within a job share the /workspace directory.
name: build-test-deploy

jobs:
  build:
    image: alpine:3.20
    steps:
      - name: Compile
        run: mkdir -p out && echo "compiled at $(date)" > out/app.txt && cat out/app.txt
      - name: Package
        run: sleep 2 && ls -la out

  unit-tests:
    image: python:3.12-alpine
    needs: build
    retries: 1            # re-run once on failure (flaky-test tolerance)
    timeout_minutes: 5
    steps:
      - name: Run tests
        run: python -c "assert 1 + 1 == 2; print('12 tests passed')"

  lint:
    image: node:20-alpine
    needs: build
    steps:
      - run: node -e "console.log('lint passed with 0 problems')"

  deploy:
    image: alpine:3.20
    needs: [unit-tests, lint]
    steps:
      - name: Deploy
        run: echo "deploying..." && sleep 1 && echo "done"
