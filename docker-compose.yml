services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conveyor
      POSTGRES_USER: conveyor
      POSTGRES_PASSWORD: conveyor
    ports:
      - "54329:5432"   # uncommon host port avoids clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor -d conveyor"]
      interval: 5s
      retries: 10

  # Not used until Phase 2 (job queue + worker heartbeats). Included now so the dev stack is stable.
  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"   # uncommon host port avoids clashing with other local Redis instances

volumes:
  pgdata:
